name: earnings filings

on:
  schedule:
    - cron: "43 23 * * 1-5"
  workflow_dispatch:

concurrency: { group: jobs, cancel-in-progress: false }

jobs:
  filings:
    if: github.event_name == 'workflow_dispatch' || vars.JOBS_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EDGAR_USER_AGENT_NAME: ${{ secrets.EDGAR_USER_AGENT_NAME }}
      EDGAR_USER_AGENT_EMAIL: ${{ secrets.EDGAR_USER_AGENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "The production database secret is required."
            exit 1
          fi
          python -m jobs.earnings
