# Daily job after the US close (Mon-Fri), a recheck the next morning, and profile batches.
# Secrets: Settings -> Secrets and variables -> Actions. Nothing here runs until PRICE_PROVIDER names a
# provider recorded in docs/data-licensing.md (yfinance_dev refuses to run with APP_ENV=prod).
name: daily

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, after the 16:00 New York close (summer and winter)
    - cron: "0 12 * * 2-6"    # recheck moves with no catalyst yet
  workflow_dispatch:

concurrency: { group: jobs, cancel-in-progress: false }

env:
  APP_ENV: prod
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
  EDGAR_USER_AGENT_NAME: ${{ secrets.EDGAR_USER_AGENT_NAME }}
  EDGAR_USER_AGENT_EMAIL: ${{ secrets.EDGAR_USER_AGENT_EMAIL }}
  PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER }}
  MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
  BASE_URL: ${{ vars.BASE_URL }}
  EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
  SMTP_USER: ${{ secrets.SMTP_USER }}
  SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}

jobs:
  run:
    # Schedules stay off until the repo variable JOBS_ENABLED is "true" (after Neon and a licensed price provider).
    if: github.event_name == 'workflow_dispatch' || vars.JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Collect finished profile batches
        run: python -m jobs.profiles --collect
      - name: Daily returns, filings, moves, notes, alerts
        if: github.event.schedule != '0 12 * * 2-6'
        run: python -m jobs.daily
      - name: Recheck moves
        if: github.event.schedule == '0 12 * * 2-6'
        run: python -m jobs.daily --recheck
      - name: Profiles for new filings, Sonnet upgrades for followed stocks
        if: github.event.schedule != '0 12 * * 2-6'
        run: |
          python -m jobs.profiles
          python -m jobs.profiles --upgrade
