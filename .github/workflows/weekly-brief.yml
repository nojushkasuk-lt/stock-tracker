# Independent of the licensed closing-price job.
name: weekly brief

on:
  schedule:
    - cron: "13 8 * * 1"
  workflow_dispatch:

concurrency: { group: jobs, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: prod
      EFFORT_ROUTINE: low
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EDGAR_USER_AGENT_NAME: ${{ secrets.EDGAR_USER_AGENT_NAME }}
      EDGAR_USER_AGENT_EMAIL: ${{ secrets.EDGAR_USER_AGENT_EMAIL }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "The production database secret is required."
            exit 1
          fi
          python -m jobs.weekly_brief
