# Weekly: re-rank the universe by market cap, refresh Wikidata facts and logos, first profiles for new entrants.
name: weekly

on:
  schedule:
    - cron: "0 9 * * 6"   # Saturday 09:00 UTC
  workflow_dispatch:

concurrency: { group: jobs, cancel-in-progress: false }

env:
  APP_ENV: prod
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  EDGAR_USER_AGENT_NAME: ${{ secrets.EDGAR_USER_AGENT_NAME }}
  EDGAR_USER_AGENT_EMAIL: ${{ secrets.EDGAR_USER_AGENT_EMAIL }}
  PRICE_PROVIDER: ${{ vars.PRICE_PROVIDER }}

jobs:
  run:
    # Schedules stay off until the repo variable JOBS_ENABLED is "true" (after Neon and a licensed price provider).
    if: github.event_name == 'workflow_dispatch' || vars.JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m jobs.universe
      - run: python -m jobs.facts
      - run: python -m jobs.profiles --first
