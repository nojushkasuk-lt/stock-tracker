# Weekly: new US listings, Wikidata facts and logos, first profiles for stocks that have none.
# The top-100 ranking is frozen (no licensed market-cap source) and re-ranked by hand a few times a year,
# so jobs.universe runs with --listings-only. The nightly job collects the profile batch.
name: weekly

on:
  schedule:
    - cron: "0 9 * * 6"   # Saturday 09:00 UTC
  workflow_dispatch:

concurrency: { group: jobs, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: prod
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      EDGAR_USER_AGENT_NAME: ${{ secrets.EDGAR_USER_AGENT_NAME }}
      EDGAR_USER_AGENT_EMAIL: ${{ secrets.EDGAR_USER_AGENT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: test -n "$DATABASE_URL" || { echo "DATABASE_URL is required."; exit 1; }
      - run: python -m jobs.universe --listings-only
      - run: python -m jobs.facts
      - run: python -m jobs.profiles --first
