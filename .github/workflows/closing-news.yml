name: closing news

on:
  schedule:
    - cron: "17 18,21 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      session:
        description: "Trading session to backfill (YYYY-MM-DD). Leave blank for today in New York."
        type: string

concurrency: { group: closing-news, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: prod
      EFFORT_ROUTINE: low
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      SESSION_DATE: ${{ inputs.session }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL is required."; exit 1; }
          if [ -n "$SESSION_DATE" ]; then
            python -m jobs.closing_news --date "$SESSION_DATE"
          else
            python -m jobs.closing_news
          fi
