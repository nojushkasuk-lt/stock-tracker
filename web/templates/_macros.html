{% macro refs(numbers) -%}
{%- if numbers %}<sup class="ref">{% for n in numbers %}<a href="#src-{{ n }}">{{ n }}</a>{% if not loop.last %} {% endif %}{% endfor %}</sup>{% endif -%}
{%- endmacro %}

{% macro logo(stock, size="") -%}
<span class="logo {{ size }}" aria-hidden="true"><span class="logo-letter">{{ stock.name[:1] }}</span>
{%- if stock.logo %}<img src="{{ stock.logo }}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">{% endif -%}
</span>
{%- endmacro %}
